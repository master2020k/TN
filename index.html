<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Playlist Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
/* ---- SAME CSS AS YOUR ORIGINAL (UNCHANGED) ---- */
:root{
  --bg:#121212;
  --surface:#1e1e1e;
  --surface2:#242424;
  --surfaceActive:#221a3d;
  --text:#fff;
  --sub:#b3b3b3;
  --accent:#7C4DFF;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Varela Round',system-ui;background:var(--bg);color:var(--text)}
.container{max-width:900px;margin:auto;padding:20px 20px 180px}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.header-title{font-size:26px;font-weight:700}
.header-sub{font-size:13px;color:var(--sub)}
.quality-selector{display:flex;gap:8px;background:var(--surface);padding:6px;border-radius:50px}
.quality-btn{background:transparent;color:var(--sub);border:none;border-radius:50px;padding:8px 16px;cursor:pointer;font-weight:600}
.quality-btn.active{background:var(--accent);color:#000}
.list{margin-top:16px;display:flex;flex-direction:column;gap:1px}
.card{background:var(--surface);padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.card img{width:48px;height:48px;border-radius:50%}
.card.playing{border:2px solid var(--accent)}
.play-wrap{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.play-wrap.playing{background:var(--accent)}
.fab,.download-all{position:fixed;right:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
.fab{bottom:24px}
.download-all{bottom:92px;display:none}
.sheet{position:fixed;left:0;right:0;bottom:-100%;background:var(--surface);padding:20px;border-radius:20px 20px 0 0;transition:.3s}
.sheet.open{bottom:0}
.progress-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
.progress-modal.show{display:flex}
.progress-content{background:var(--surface);padding:30px;border-radius:20px;text-align:center}
.progress-bar{height:8px;background:var(--accent);width:0%}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <div>
      <div class="header-title">Playlist</div>
      <div class="header-sub" id="trackCount">No playlist loaded</div>
    </div>
    <div class="quality-selector">
      <button class="quality-btn" data-quality="96kbps">96</button>
      <button class="quality-btn active" data-quality="160kbps">160</button>
      <button class="quality-btn" data-quality="320kbps">320</button>
    </div>
  </div>
  <div class="list" id="tracks"></div>
</div>

<button class="download-all" id="downloadAll">
  <span class="material-icons">download</span>
</button>

<button class="fab" id="fab">+</button>

<div class="sheet" id="sheet">
  <input id="playlistUrl" placeholder="Paste Spotify playlist URL">
  <button id="loadBtn">Load</button>
</div>

<div class="progress-modal" id="progressModal">
  <div class="progress-content">
    <div id="progressTitle">Downloading Songs...</div>
    <div class="progress-bar" id="progressBar"></div>
    <div id="progressText">0 / 0</div>
  </div>
</div>

<audio id="player"></audio>

<script>
/* ---------------- FIXED JS ---------------- */

const SPOTIFY_API = "https://spotify-api-6yog.vercel.app/api/scrape";
const SAAVN_API   = "https://jiosavan-api-with-playlist.vercel.app/api/search/songs";

/* DOM */
const tracksDiv = document.getElementById("tracks");
const trackCount = document.getElementById("trackCount");
const player = document.getElementById("player");
const downloadBtn = document.getElementById("downloadAll");
const progressModal = document.getElementById("progressModal");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const progressTitle = document.getElementById("progressTitle");
const fab = document.getElementById("fab");
const sheet = document.getElementById("sheet");
const loadBtn = document.getElementById("loadBtn");
const playlistUrl = document.getElementById("playlistUrl");

let selectedQuality = "160kbps";
let currentCard = null;
let currentSongKey = null;
const saavnCache = {};

/* Quality */
document.querySelectorAll(".quality-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".quality-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedQuality=btn.dataset.quality;
  };
});

fab.onclick=()=>sheet.classList.add("open");

/* Robust playlist ID */
function getPlaylistId(url){
  try{
    return new URL(url).pathname.split("/playlist/")[1]?.split("?")[0];
  }catch{return null;}
}

async function prefetchSaavn(key){
  const res=await fetch(`${SAAVN_API}?query=${encodeURIComponent(key)}&limit=1`);
  const json=await res.json();
  saavnCache[key]=json?.data?.results?.[0]?.downloadUrl||[];
}

loadBtn.onclick=async()=>{
  const id=getPlaylistId(playlistUrl.value.trim());
  if(!id) return alert("Invalid playlist URL");

  sheet.classList.remove("open");
  tracksDiv.innerHTML="";
  downloadBtn.style.display="none";

  const res=await fetch(`${SPOTIFY_API}?playlist=${id}`);
  const data=await res.json();

  const tracks=data.tracks.filter(t=>t.title);
  trackCount.textContent=`${tracks.length} tracks`;

  await Promise.all(tracks.map(t=>prefetchSaavn(`${t.title} ${t.artists}`)));
  downloadBtn.style.display="block";

  tracks.forEach(t=>{
    const key=`${t.title} ${t.artists}`;
    const card=document.createElement("div");
    card.className="card";
    card.dataset.key=key;
    card.innerHTML=`
      <img src="${t.image}">
      <div style="flex:1">
        <div>${t.title}</div>
        <small>${t.artists}</small>
      </div>
      <div class="play-wrap"><span class="material-icons">play_arrow</span></div>
    `;

    card.querySelector(".play-wrap").onclick=()=>{
      const urls=saavnCache[key];
      const url=urls.find(u=>u.quality===selectedQuality)?.url;
      if(!url) return;

      if(currentCard) currentCard.classList.remove("playing");
      card.classList.add("playing");

      player.src=url;
      player.play();
      currentCard=card;
      currentSongKey=key;
    };

    tracksDiv.appendChild(card);
  });
};

player.onended=()=>{
  if(currentCard) currentCard.classList.remove("playing");
};

/* Download all */
downloadBtn.onclick=async()=>{
  const songs=Object.entries(saavnCache);
  let done=0;

  progressModal.classList.add("show");
  progressText.textContent=`0 / ${songs.length}`;

  for(const [name,urls] of songs){
    const file=urls.find(u=>u.quality===selectedQuality)?.url;
    if(!file) continue;

    const blob=await fetch(file).then(r=>r.blob());
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name.replace(/[<>:"/\\|?*]/g,"_")+".mp3";
    a.click();
    done++;
    progressBar.style.width=`${(done/songs.length)*100}%`;
    progressText.textContent=`${done} / ${songs.length}`;
    await new Promise(r=>setTimeout(r,400));
  }

  progressTitle.textContent="Download Complete!";
};
</script>
</body>
</html>
