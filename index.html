<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playlist Player – Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body{margin:0;background:#121212;color:#fff;font-family:'Varela Round'}
.container{max-width:900px;margin:auto;padding:20px 20px 200px}
.header{display:flex;justify-content:space-between;align-items:center}
.list{margin-top:16px}
.card{display:flex;align-items:center;gap:12px;padding:12px;background:#1e1e1e;margin-bottom:1px}
.card.playing{background:#221a3d;border-left:4px solid #7c4dff}
.card img{width:48px;height:48px;border-radius:50%}
.card-info{flex:1}
.title{font-size:14px;font-weight:600}
.meta{font-size:12px;color:#aaa}
.play-wrap{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2a2a2a;cursor:pointer}
.play-wrap.playing{background:#7c4dff}
.material-icons{color:#7c4dff}
.play-wrap.playing .material-icons{color:#000}

.player-bar{
position:fixed;bottom:0;left:0;right:0;
background:#1e1e1e;padding:12px;
display:flex;flex-direction:column;gap:8px
}
.controls{display:flex;justify-content:center;gap:16px}
.controls button{background:none;border:none;color:#7c4dff;font-size:26px;cursor:pointer}
.seek{display:flex;align-items:center;gap:8px}
.seek input{flex:1}
.time{font-size:12px;color:#aaa}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h2>Playlist</h2>
    <span id="trackCount">0 tracks</span>
  </div>
  <div class="list" id="tracks"></div>
</div>

<div class="player-bar">
  <div class="seek">
    <span class="time" id="currentTime">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0">
    <span class="time" id="duration">0:00</span>
  </div>
  <div class="controls">
    <button id="prev"><span class="material-icons">skip_previous</span></button>
    <button id="playMain"><span class="material-icons">play_arrow</span></button>
    <button id="next"><span class="material-icons">skip_next</span></button>
  </div>
</div>

<audio id="player"></audio>

<script>
/* ================= CONFIG ================= */
const SPOTIFY_API="https://spotify-api-6yog.vercel.app/api/scrape";
const SAAVN_API="https://jiosavan-api-with-playlist.vercel.app/api/search/songs";

/* ================= ELEMENTS ================= */
const player=document.getElementById("player");
const tracksDiv=document.getElementById("tracks");
const seekBar=document.getElementById("seekBar");
const curTime=document.getElementById("currentTime");
const durTime=document.getElementById("duration");
const playMain=document.getElementById("playMain");

/* ================= STATE ================= */
let tracks=[];
let saavnCache={};
let currentIndex=-1;

/* ================= AUDIO SETUP ================= */
player.preload="auto";
player.crossOrigin="anonymous";

/* ================= HELPERS ================= */
const fmt=t=>`${Math.floor(t/60)}:${Math.floor(t%60).toString().padStart(2,"0")}`;

/* ================= LOAD PLAYLIST ================= */
async function loadPlaylist(playlistUrl){
  const id=new URL(playlistUrl).pathname.split("/playlist/")[1];
  const res=await fetch(`${SPOTIFY_API}?playlist=${id}`);
  const data=await res.json();
  tracks=data.tracks.filter(t=>t.title);
  document.getElementById("trackCount").textContent=`${tracks.length} tracks`;

  await Promise.all(tracks.map(t=>prefetchSaavn(`${t.title} ${t.artists}`)));
  render();
}

/* ================= SAAVN FETCH (FIXED) ================= */
async function prefetchSaavn(key){
  try{
    const r=await fetch(`${SAAVN_API}?query=${encodeURIComponent(key)}&limit=1`);
    const j=await r.json();
    const song=j?.data?.results?.[0];
    if(!song) return;

    saavnCache[key]={
      stream: song.mediaPreviewUrl || song.media_url || null,
      downloads: Array.isArray(song.downloadUrl) ? song.downloadUrl : []
    };
  }catch(e){
    console.error("Saavn error:", key, e);
  }
}

/* ================= SAFE PLAY ================= */
function safePlay(url){
  player.pause();
  player.currentTime=0;
  player.src=url;

  const p=player.play();
  if(p){
    p.catch(()=>{
      console.warn("Playback failed → skipping");
      playNext();
    });
  }
}

/* ================= PLAY INDEX ================= */
function playIndex(i){
  if(i<0||i>=tracks.length) return;
  currentIndex=i;

  const key=`${tracks[i].title} ${tracks[i].artists}`;
  const data=saavnCache[key];

  const url=
    data?.stream ||
    data?.downloads?.[0]?.url;

  if(!url){
    playNext();
    return;
  }

  safePlay(url);
  updateUI();
}

/* ================= UI ================= */
function updateUI(){
  document.querySelectorAll(".card").forEach((c,i)=>{
    c.classList.toggle("playing",i===currentIndex);
    c.querySelector(".material-icons").textContent=
      i===currentIndex && !player.paused?"pause":"play_arrow";
  });
  playMain.querySelector(".material-icons").textContent=
    player.paused?"play_arrow":"pause";
}

function render(){
  tracksDiv.innerHTML="";
  tracks.forEach((t,i)=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${t.image}">
      <div class="card-info">
        <div class="title">${t.title}</div>
        <div class="meta">${t.artists}</div>
      </div>
      <div class="play-wrap">
        <span class="material-icons">play_arrow</span>
      </div>
    `;
    card.querySelector(".play-wrap").onclick=()=>playIndex(i);
    tracksDiv.appendChild(card);
  });
}

/* ================= EVENTS ================= */
player.ontimeupdate=()=>{
  if(player.duration){
    seekBar.value=(player.currentTime/player.duration)*100;
    curTime.textContent=fmt(player.currentTime);
    durTime.textContent=fmt(player.duration);
  }
};

seekBar.oninput=()=>{
  if(player.duration){
    player.currentTime=(seekBar.value/100)*player.duration;
  }
};

player.onerror=()=>playNext();
player.onstalled=()=>playNext();
player.onended=()=>playNext();

playMain.onclick=()=>{
  if(player.paused) player.play().catch(()=>{});
  else player.pause();
  updateUI();
};

document.getElementById("next").onclick=playNext;
document.getElementById("prev").onclick=()=>playIndex(currentIndex-1);

/* ================= NEXT ================= */
function playNext(){
  if(currentIndex+1<tracks.length){
    playIndex(currentIndex+1);
  }
}

/* ================= AUTO LOAD ================= */
loadPlaylist("PASTE_SPOTIFY_PLAYLIST_URL_HERE");
</script>

</body>
</html>
